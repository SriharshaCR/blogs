<header class="site-header">
  <div class="header-inner">
    <a href="{{ site.baseurl }}/" class="site-logo" aria-label="{{ site.title }} home">
      Harsha's Blog<span class="logo-dot">.</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ site.baseurl }}/" class="nav-link {% if page.url == '/' %}nav-link--active{% endif %}">Writing</a>
      <a href="{{ site.baseurl }}/enterprises-ai-playbook/" class="nav-link {% if page.series == 'enterprises-ai-playbook' %}nav-link--active{% endif %}">AI Playbook</a>
      <a href="{{ site.baseurl }}/search/" class="nav-link" aria-label="Search">Search</a>
    </nav>
    <div class="header-actions">
      <button
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark/light theme"
      >
        <span class="theme-icon theme-icon--light">&#9788;</span>
        <span class="theme-icon theme-icon--dark">&#9790;</span>
      </button>
    </div>
  </div>
</header>

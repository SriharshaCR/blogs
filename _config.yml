title: "Connecting Dots"
description: "I write about technology, AI, cloud-native engineering, leadership, productivity, and the patterns I notice while building, mentoring, and learning in public."
author: "Harsha"
author_fullname: "Sriharsha C R"
email: ""
url: "https://sriharshacr.github.io"
baseurl: "/blogs"
twitter_username: "sriharsha_cr"
github_username: "SriharshaCR"
linkedin_username: "sriharshacr"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Collections
collections:
  enterprises-ai-playbook:
    output: true
    permalink: /enterprises-ai-playbook/:slug/
  ai-token-economics:
    output: true
    permalink: /ai-token-economics/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "enterprises-ai-playbook"
    values:
      layout: "post"
      series: "enterprises-ai-playbook"
      series_name: "The Enterprise AI Playbook"
  - scope:
      path: ""
      type: "ai-token-economics"
    values:
      layout: "post"
      series: "ai-token-economics"
      series_name: "AI Token Economics"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - README.md

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# GA4 — add your Measurement ID here
google_analytics: "G-VMPTZXH89K"
